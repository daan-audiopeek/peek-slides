# Builds the macOS app on GitHub's Macs and uploads "MxU Slides.app" as a
# downloadable zip (Actions tab › latest run › Artifacts).
#
# Runs on every push to main, on pull requests, and on demand via
# "Run workflow" in the Actions tab. Built without the optional NDI SDK and
# ProPresenter types, so those two features show as unavailable in the app.
# The app is ad-hoc signed: on first launch, allow it under
# System Settings › Privacy & Security › "Open Anyway".

name: Build macOS app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mac

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version
          node --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          mkdir -p build
          xcodebuild \
            -project MxUSlides.xcodeproj \
            -scheme MxUSlides \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            MXU_GIT_COMMIT=${{ github.sha }} \
            build 2>&1 | tee build/xcodebuild.log | grep -E 'error:|\*\* BUILD' || true
          test -d "build/DerivedData/Build/Products/Debug/MxU Slides.app"

      - name: Zip app
        run: |
          cd build/DerivedData/Build/Products/Debug
          ditto -c -k --sequesterRsrc --keepParent "MxU Slides.app" "$GITHUB_WORKSPACE/MxU-Slides.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: MxU-Slides-${{ github.sha }}
          path: MxU-Slides.zip
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: apps/mac/build/xcodebuild.log
          if-no-files-found: ignore
