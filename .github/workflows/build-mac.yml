# Builds the macOS app on GitHub's Macs and uploads "Peek-Slides.app" as a
# downloadable zip (Actions tab › latest run › Artifacts).
#
# Runs on every push (any branch), on pull requests, and on demand via
# "Run workflow" in the Actions tab. Includes ProPresenter import (types are
# generated during the build). Built without the optional NDI SDK, so NDI
# shows as unavailable in the app.
# The app is ad-hoc signed: on first launch, allow it under
# System Settings › Privacy & Security › "Open Anyway".

name: Build macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mac

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install XcodeGen and protoc
        run: brew install xcodegen protobuf

      # Build protoc-gen-swift at the SwiftProtobuf version ProImport pins, so
      # the generated code always matches the library it compiles against.
      - name: Build protoc-gen-swift
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('Packages/ProImport/Package.resolved', 'utf8')).pins.find(p => p.identity === 'swift-protobuf').state.version")
          git clone -q --depth 1 --branch "$VERSION" https://github.com/apple/swift-protobuf.git "$RUNNER_TEMP/swift-protobuf"
          swift build -c release --package-path "$RUNNER_TEMP/swift-protobuf" --product protoc-gen-swift
          echo "$RUNNER_TEMP/swift-protobuf/.build/release" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          xcodebuild -version
          xcodegen --version
          node --version
          protoc --version
          protoc-gen-swift --version

      - name: Generate ProPresenter types
        run: scripts/generate-propresenter-proto.sh

      - name: Test ProPresenter import
        run: swift test --package-path Packages/ProImport --force-resolved-versions

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          mkdir -p build
          xcodebuild \
            -project MxUSlides.xcodeproj \
            -scheme MxUSlides \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            MXU_GIT_COMMIT=${{ github.sha }} \
            build 2>&1 | tee build/xcodebuild.log | grep -E 'error:|\*\* BUILD' || true
          if [ ! -d "build/DerivedData/Build/Products/Debug/Peek-Slides.app" ]; then
            # Surface the compiler errors as one annotation on the run page.
            errors=$(grep -E ' error: ' build/xcodebuild.log | sed "s|$GITHUB_WORKSPACE/||" | sort -u | head -40)
            echo "::error title=Build failed::${errors//$'\n'/%0A}"
            exit 1
          fi

      - name: Zip app
        run: |
          cd build/DerivedData/Build/Products/Debug
          ditto -c -k --sequesterRsrc --keepParent "Peek-Slides.app" "$GITHUB_WORKSPACE/Peek-Slides.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Peek-Slides-${{ github.ref_name }}-${{ github.sha }}
          path: Peek-Slides.zip
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: apps/mac/build/xcodebuild.log
          if-no-files-found: ignore
